# PLACEHOLDERS ONLY — never put a real credential in this file, not even
# base64-encoded (base64 is encoding, not encryption).
#
# The real Secret is created out-of-band by scripts/k8s/create-secrets.sh
# (from the gitignored .env) locally, and by the CD workflow (from GitHub
# Secrets) in CI. Both overlays remove this placeholder through
# k8s/components/external-secret, so `kubectl apply -k` can never overwrite
# the real values. This file exists to document the Secret's shape (name and
# keys) and to let `kustomize build k8s/base` render a complete picture.
# docs/architecture/kubernetes.md §7.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
  labels:
    app.kubernetes.io/part-of: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  LLM_API_KEY: "REPLACE_ME"
