# Kustomize base: everything that is identical in every environment.
# Environment differences (image names, TRIAGE_PROVIDER) live in
# k8s/overlays/{dev,prod}. Build with: kubectl kustomize k8s/overlays/<env>
#
# hpa.yaml/vpa.yaml (Milestone 8) require the VPA CRDs to be installed on the
# cluster before `kubectl apply -k` — see docs/ENGINEERING-NOTES.md Milestone 8.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - migrate-job.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - pdb.yaml
  - hpa.yaml
  - vpa.yaml
