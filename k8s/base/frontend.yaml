# nginx serving the built React bundle. In Kubernetes the Ingress routes
# `/api` straight to the backend Service, so nginx's own `/api` proxy block
# (a Compose-only convenience) is never used here — the same image runs
# unchanged in both environments (build once, deploy many).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: civicpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: civicpulse
    spec:
      # Kubernetes injects <SERVICE>_PORT=tcp://... env vars for every Service into
      # every pod; e.g. the `backend` Service would set BACKEND_PORT to a URL and
      # crash the app's integer BACKEND_PORT setting. Discovery here is by DNS name,
      # so the injected variables are unused — turn them off.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          # Tag is a placeholder; each overlay rewrites name + tag with the
          # immutable commit SHA. Never `latest`.
          image: civicpulse-frontend:REPLACE_WITH_SHA
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: civicpulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
