# Protects against *voluntary* disruptions (node drains, upgrades) evicting
# every backend pod at once. Complements — doesn't replace — the Deployment's
# minimum of 2 replicas. docs/architecture/kubernetes.md §13.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: civicpulse
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
