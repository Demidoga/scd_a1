# Redis: a Deployment with a PVC (matches the assignment's object table).
# It holds only derived/cache state — PostgreSQL stays the source of truth —
# but AOF persistence on a volume keeps the cache warm across restarts.
#
# `strategy: Recreate` is deliberate: the PVC is ReadWriteOnce, so under the
# default RollingUpdate the replacement pod could not start (the old pod still
# holds the volume) while the old pod would wait for the new one to become
# Ready — a deadlock. Recreate stops the old pod first, releasing the volume.
# docs/architecture/kubernetes.md §5.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: civicpulse
spec:
  accessModes: ["ReadWriteOnce"]
  # No storageClassName: uses the cluster default (k3d/k3s: local-path).
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: civicpulse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: civicpulse
    spec:
      # Kubernetes injects <SERVICE>_PORT=tcp://... env vars for every Service into
      # every pod; e.g. the `backend` Service would set BACKEND_PORT to a URL and
      # crash the app's integer BACKEND_PORT setting. Discovery here is by DNS name,
      # so the injected variables are unused — turn them off.
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
# ClusterIP only — the cache is never exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: civicpulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
