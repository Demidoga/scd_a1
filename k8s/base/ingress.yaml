# One entry point: `/api` -> backend, everything else -> frontend. Same-origin,
# so the browser never needs a backend URL baked into the bundle (ADR 0002).
#
# An Ingress is only routing configuration; a controller must implement it.
# k3d ships Traefik as the built-in controller and registers it as the default
# IngressClass, so no `ingressClassName` is set. Traefik picks the longest
# matching path prefix, so `/api/...` reaches the backend and the backend's
# own routes (already mounted under `/api`) need no prefix stripping.
#
# No `host:` on purpose — a single rule set answers on any Host header, so
# smoke tests can hit http://localhost:8080 without a Host override.
# docs/architecture/kubernetes.md §6.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse
  namespace: civicpulse
  labels:
    app.kubernetes.io/part-of: civicpulse
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
