name: Release

# Tag push (v1.2.3) = a named, citable release. Independent of cd.yml: it
# builds/publishes its own semver-tagged images and does not touch the
# cluster (see docs/architecture/cicd.md §4).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # Same gate as PRs and cd.yml, reused rather than copied. Nothing is
  # published from a tag whose code fails lint, tests, scan or integration.
  test:
    name: Full lint/test suite (tagged commit)
    uses: ./.github/workflows/ci.yml

  build-push-release:
    name: Build & push release images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase GHCR image repo
        id: repo
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_repo=ghcr.io/$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.ref_name is the tag itself, e.g. v1.2.3 — images are tagged
      # with that exact semver string, never `latest`.
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.repo.outputs.image_repo }}/civicpulse-backend:${{ github.ref_name }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.repo.outputs.image_repo }}/civicpulse-frontend:${{ github.ref_name }}

  github-release:
    name: Create GitHub Release
    needs: build-push-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
