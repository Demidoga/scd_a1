# Same-origin `/api` proxy so the built frontend never has a backend URL
# baked in (docs/architecture/frontend.md §3, ADR 0002). Listens on an
# unprivileged port because the container runs as a non-root user.

server {
    listen 8080;
    server_name _;

    # Resolve `backend` at request time (Docker's embedded DNS) instead of
    # once at config load, so nginx doesn't refuse to start/reload if the
    # backend container is briefly absent, and picks up its IP again after
    # a restart/recreate.
    resolver 127.0.0.11 valid=30s;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # Static assets: served directly, long-lived cache (Vite fingerprints
    # filenames on build).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same-origin API proxy to the backend service. `$backend` as a variable
    # (rather than a bare hostname in proxy_pass) forces the `resolver`
    # directive above to be used for DNS lookup at request time. Note: with
    # a variable in proxy_pass, nginx does NOT rewrite the matched location
    # prefix the way it would with a literal proxy_pass — omitting a URI
    # after the host here forwards the original request URI unchanged,
    # which is what we want since the backend's own routes are mounted
    # under `/api/...` already (docs/architecture/backend.md).
    location /api/ {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths resolve to index.html so React Router
    # handles client-side routes (/dashboard, /stats) on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
